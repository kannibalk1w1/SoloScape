// Isolated TeaVM 0.16.0 WasmGC build of the verbatim native face-edge kernel.
// Inputs: generated sources from tools/extract_face_kernel.py (under build/generated-src).
// The native jar is not on this classpath, so nothing outside the extracted closure is compiled.
plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.teavm:teavm-jso:0.16.0'
}
sourceSets.main.java.srcDirs = ['src/shared/java', 'src/browser/java', 'build/generated-src']
teavm {
    all { mainClass = 'RasterProbe' }
    wasmGC { targetFileName = 'raster.wasm' }
}
