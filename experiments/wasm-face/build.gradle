// Isolated TeaVM 0.16.0 WasmGC build of the extracted native face-dispatch closure.
// Generated sources come from tools/extract_face_closure.py under build/generated-src.
// The native jar is not on this classpath, so nothing outside the extracted closure is compiled.
plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.teavm:teavm-jso:0.16.0'
}
// Clip mode passes -PfaceGenDir and -PfaceMain; the default build is unchanged.
def faceGenDir = findProperty('faceGenDir') ?: 'build/generated-src'
sourceSets.main.java.srcDirs = ['src/shared/java', 'src/browser/java', faceGenDir]
teavm {
    all { mainClass = findProperty('faceMain') ?: 'FaceProbe' }
    wasmGC { targetFileName = 'face.wasm' }
}
